<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swipe Audio Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app-container">
        <div class="instruction">
            <h1>Swipe Interaction</h1>
            <p>Swipe left or right to interact</p>
        </div>
        <div class="visual-feedback"></div>
        <div id="debug-log"
            style="position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 10px; max-height: 200px; overflow-y: auto; font-size: 12px; pointer-events: none; z-index: 1000; display: none;">
        </div>
        <button id="test-audio" style="position: fixed; top: 10px; right: 10px; z-index: 1000; padding: 10px;">Test
            Audio</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
